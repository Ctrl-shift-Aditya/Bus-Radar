<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Radar</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- FULLSCREEN MAP -->
    <div id="map"></div>

    <!-- CONTROL PANEL (overlaid on map) -->
    <div id="controls">

        <h2 id="appTitle">🚌 Bus Radar</h2>

        <label for="busNumberInput">Bus Number</label>

        <input type="text"
            id="busNumberInput"
            placeholder="e.g. 42, 7A, Route 5"
            autocomplete="off">

        <div id="buttonRow">

            <button id="startBtn">
                Start Broadcasting
            </button>

            <button id="stopBtn">
                Stop
            </button>

        </div>

        <p id="statusText">Not broadcasting</p>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- App Logic -->
    <script type="module" src="script.js"></script>

</body>

</html>
